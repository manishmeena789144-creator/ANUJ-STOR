<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Verification - ANUJ FF STOR</title>
    <style>
        :root {
            --neon-purple: #b026ff;
            --neon-glow: rgba(176, 38, 255, 0.4);
            --bg-dark: #0f0c1b;
            --card-bg: #1a162b;
            --text-color: #ffffff;
            --text-secondary: #a3a3c2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .verify-container {
            background-color: var(--card-bg);
            border: 1px solid var(--neon-purple);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 0 20px var(--neon-glow);
            text-align: center;
        }

        h1 {
            color: var(--text-color);
            margin-bottom: 10px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--neon-purple);
        }

        p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .verification-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .checkbox-label {
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .checkbox-label input {
            width: 20px;
            height: 20px;
            accent-color: var(--neon-purple);
            cursor: pointer;
        }

        .verify-btn {
            background-color: transparent;
            border: 2px solid var(--neon-purple);
            color: var(--text-color);
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .verify-btn:hover {
            background-color: var(--neon-purple);
            box-shadow: 0 0 15px var(--neon-purple);
        }

        .verify-btn:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
            box-shadow: none;
            background: transparent;
        }

        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--neon-purple);
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-text {
            margin-top: 15px;
            font-size: 14px;
            color: var(--neon-purple);
            display: none;
        }

        .footer-text {
            margin-top: 30px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="verify-container">
        <h1>Human Verification</h1>
        <p>Please complete the verification below to proceed to your file download.</p>
        
        <div class="verification-box">
            <label class="checkbox-label">
                <input type="checkbox" id="verifyCheck">
                I am not a robot
            </label>
        </div>

        <button id="submitBtn" class="verify-btn" disabled>Continue to Download</button>
        
        <div class="spinner" id="spinner"></div>
        <div class="status-text" id="statusText">Verifying, please wait...</div>
        
        <div class="footer-text">ANUJ FF STOR &copy; 2026</div>
    </div>

    <script>
        const verifyCheck = document.getElementById('verifyCheck');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const statusText = document.getElementById('statusText');

        // Enable button only when checkbox is checked
        verifyCheck.addEventListener('change', function() {
            submitBtn.disabled = !this.checked;
        });

        submitBtn.addEventListener('click', function() {
            // Show loader and disable button
            submitBtn.style.display = 'none';
            spinner.style.display = 'block';
            statusText.style.display = 'block';
            verifyCheck.disabled = true;

            // Simulate server verification delay (2 seconds) then redirect to direct download
            setTimeout(() => {
    const targetURL = 'options.html'; 
    window.location.href = targetURL;
}, 2000);

        });
    </script>
</body>
</html>
